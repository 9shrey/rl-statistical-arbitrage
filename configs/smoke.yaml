seed: 42

data:
  source: fixture
  bar_interval: 1d
  start: 2020-01-01
  end:   2022-12-31
  symbols: [SYNA, SYNB]
  cache_dir: tests/fixtures

pairs:
  corr_threshold: 0.50
  corr_window_days: 60
  pvalue_max: 0.20
  half_life_min_days: 1
  half_life_max_days: 90
  top_k: 5

spread:
  hedge_window_days: 30
  zscore_window_days: 10

regime:
  n_states: 2
  features: [realized_vol, abs_zscore]
  refit_each_fold: true

env:
  action_space: discrete
  features: [zscore, realized_vol, bid_ask_proxy, regime_onehot, position]
  reward:
    lambda_turnover: 0.0005
    dd_threshold: 0.10
    dd_penalty: 0.5
    clip: 0.05

costs:
  commission_bps_per_side: 0.5
  slippage_half_spread_bps: 1.0
  impact_bps_per_pct_adv: 10.0

risk:
  vol_target_annual: 0.10
  max_position_notional_pct_equity: 0.50
  hard_dd_stop: 0.50

train:
  algo: zscore_baseline
  total_timesteps: 1000
  n_envs: 1

backtest:
  scheme: walk_forward
  train_window_days: 180
  test_window_days: 60
  step_days: 60
  warm_start: false

mlflow:
  enabled: false

artifacts_dir: artifacts/smoke
